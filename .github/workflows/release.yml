name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Go release binaries
        run: bash scripts/build-assets.sh "$VERSION"

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Package frontend and migrations archives
        run: |
          tar -czf release/frontend-dist.tar.gz -C frontend/dist .
          tar -czf release/migrations.tar.gz -C migrations .

      - name: Assemble per-architecture release bundles
        run: |
          for ARCH in linux_amd64 linux_arm64; do
            BUNDLE="$(mktemp -d)"
            cp servika-install.sh "$BUNDLE/"
            mkdir -p "$BUNDLE/assets/$ARCH"
            cp "release/$ARCH/servika-server" "release/$ARCH/servika-seed-admin" "$BUNDLE/assets/$ARCH/"
            cp release/frontend-dist.tar.gz release/migrations.tar.gz "$BUNDLE/assets/"
            cp -r assets/ops assets/nginx assets/php-fpm assets/phpmyadmin assets/systemd assets/mail "$BUNDLE/assets/"
            tar -czf "release/servika-${VERSION}-${ARCH}.tar.gz" -C "$BUNDLE" .
            rm -rf "$BUNDLE"
          done

      - name: Generate SHA256SUMS for the release bundles
        working-directory: release
        run: |
          sha256sum "servika-${VERSION}-linux_amd64.tar.gz" \
                    "servika-${VERSION}-linux_arm64.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {p=1; print; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          if [ ! -s release/RELEASE_NOTES.md ]; then
            echo "no CHANGELOG section for $VERSION; falling back to auto-generated notes" >&2
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release/RELEASE_NOTES.md ]; then
            NOTES_ARG=(--notes-file release/RELEASE_NOTES.md)
          else
            NOTES_ARG=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Servika $VERSION" \
            "${NOTES_ARG[@]}" \
            "release/servika-${VERSION}-linux_amd64.tar.gz" \
            "release/servika-${VERSION}-linux_arm64.tar.gz" \
            "release/SHA256SUMS"

      # The release is not finished until SHA256SUMS carries a signature, and
      # this job deliberately cannot produce one.
      #
      # The signing key's whole value is that it is NOT here. SHA256SUMS and the
      # bundles it describes are published to the same release by the same
      # token, so a key held in a repository secret would be reachable by
      # anybody who can rewrite the artefacts, and the signature would prove
      # nothing that the checksum does not already prove.
      #
      # SHA256SUMS is generated by this job, so it cannot be signed before it
      # exists either. The signature is therefore a second, manual step, and
      # until it is uploaded an installer that carries the public key refuses
      # this release. That is the correct direction to fail.
      - name: Say how to sign this release
        run: |
          cat <<NOTE
          ════════════════════════════════════════════════════════════════
          This release is PUBLISHED but NOT YET SIGNED.

          On the machine that holds the signing key:

            gh release download $GITHUB_REF_NAME -p SHA256SUMS -D /tmp/svk
            go run scripts/servika_sign.go -key ~/.servika-signing-key \\
                 -detached /tmp/svk/SHA256SUMS
            gh release upload $GITHUB_REF_NAME /tmp/svk/SHA256SUMS.sig

          Until then, any installer carrying the release public key will
          refuse this tag.
          ════════════════════════════════════════════════════════════════
          NOTE
