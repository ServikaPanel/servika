name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    # The live-database tests skip themselves without SERVIKA_TEST_DSN and the
    # package still prints ok, so without a server here every test that proves
    # the SQL passes by not running.
    #
    # 10.11 is the MariaDB AlmaLinux 10 ships. The image is pinned by digest for
    # the same reason the actions are pinned to a commit: a tag can be moved.
    # The root account has no password because the container exists only on the
    # runner for the length of this job, and a credential in the repository
    # would read as a real one.
    services:
      mariadb:
        image: mariadb:10.11@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: panel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # The parameters are the production DSN's (servika-install.sh). parseTime is
    # load-bearing: without it a TIMESTAMP scans as []uint8 and the attack-chain
    # correlator drops every event it reads.
    env:
      SERVIKA_TEST_DSN: root@tcp(127.0.0.1:3306)/panel?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Parses every workflow and checked-in JSON file, refuses an ambiguous
      # migration name, and verifies go.sum. None of it needs the database, so
      # it runs before the long gates and fails in seconds.
      - name: config-check
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash scripts/config-check.sh

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go vet ./...

      - name: go vet (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...

      # The vhost tests shell out to `nginx -t` and skip themselves when no nginx
      # is on PATH, so without this the configuration gates pass by not running.
      #
      # It comes from nginx.org rather than from Ubuntu: 24.04 packages 1.24,
      # which predates `http2 on;` and so rejects the configuration Servika ships
      # for AlmaLinux 10 (nginx 1.26) as an unknown directive. The tests refuse to
      # run against a version that old rather than report that as a defect.
      - name: nginx (for the configuration syntax tests)
        run: |
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list
          sudo apt-get update && sudo apt-get install -y nginx
          nginx -v

      # The live-database tests expect the panel's schema, and the thing that
      # builds it on a server is the migration runner the panel calls at startup.
      - name: Apply migrations to the test database
        run: go run scripts/migrate_test_db.go

      # The panel calls the same runner on EVERY boot, and what keeps that safe
      # is the ledger. A change that breaks the ledger passes a clean install
      # and then fails the next restart of every server in the field, naming a
      # migration that is correct. Only a second pass sees it.
      - name: Migrations are idempotent
        run: go run scripts/migrate_idempotency.go

      # -count=1 because a cached PASS is not a test run.
      #
      # -race because the concurrency tests (the SSL job map, the upload slot,
      # the PHP version cache, the diskusage single-flight) assert no value: a
      # lost mutex does not panic, so only the detector can turn them red.
      - name: go test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # golangci-lint runs staticcheck's SA checks with its own defaults. This
      # runs the tool itself, which also carries the S, ST and QF check groups,
      # and it is pinned rather than @latest so a new check cannot turn a green
      # pipeline red without anyone changing this repository.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

      # The panel runs as root against tenant-writable paths, so the taint
      # analysis is the point: command injection, path traversal and SQL built
      # from a request. HIGH/HIGH only, because that is the band that is worth
      # blocking on; a proven false positive carries a #nosec with its reason.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          "$(go env GOPATH)/bin/gosec" -quiet -severity high -confidence high ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Namespace, key and placeholder parity of the eleven translations against
      # en. tsc, ESLint and the build all pass with a key missing from a locale,
      # so this is the only gate that sees it. The script uses node built-ins
      # only, so it needs no npm ci.
      - name: Translation parity
        run: node scripts/i18n-verify.mjs

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      # The config and the plugins were already installed, but nothing ran them,
      # so the rules-of-hooks and no-restricted-globals gates only existed on
      # paper.
      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      # Production dependencies only: a CVE in a build tool does not ship to a
      # tenant's browser. It still runs on this runner with repository
      # credentials, which is a supply-chain risk rather than a runtime one, so
      # it is reported by `npm audit` without --omit=dev and not blocked here.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the history pass is the one that matters. A
      # credential that was committed and then removed is still in the history,
      # still reachable by anyone who clones, and still compromised.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Downloaded rather than taken from an action, so the bytes are checked
      # against the release's own checksum file before anything runs.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL -o gitleaks.tar.gz "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt   "${base}/gitleaks_${version}_checksums.txt"
          want="$(awk '/linux_x64\.tar\.gz/{print $1}' checksums.txt)"
          got="$(sha256sum gitleaks.tar.gz | awk '{print $1}')"
          if [ "$want" != "$got" ]; then
            echo "gitleaks checksum mismatch: want $want, got $got"
            exit 1
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Working tree
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact -v --exit-code 1

      - name: Git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1

  lint:
    name: Shell and PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A git tag is mutable: whoever controls an action's repository can move it
      # to any commit. The release job is the one place on this repository holding
      # `contents: write`, and it produces the artifact install.sh and
      # servika-update install as root on every server, so a repointed tag runs
      # code that can substitute the bundle bytes BEFORE sha256sum sees them.
      #
      # A local reusable workflow (./.github/...) is this repository's own file
      # and has nothing to pin.
      - name: Actions are pinned to a commit SHA
        run: |
          unpinned="$(grep -rhoE '^\s*(- )?uses: [^ ]+' .github/workflows/ \
            | sed -E 's/^\s*(- )?uses: //' \
            | grep -v '^\./' \
            | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$unpinned" ]; then
            echo "These actions are referenced by a mutable tag, not a commit SHA:"
            echo "$unpinned"
            echo
            echo "Resolve each with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>"
            exit 1
          fi

      # scripts/ is covered too: config-check.sh is itself a gate, and a gate
      # that cannot run reports nothing rather than failing.
      - name: shellcheck
        run: shellcheck -S warning assets/ops/* scripts/*.sh

      - name: PHP syntax
        run: |
          for f in assets/phpmyadmin/*.php; do
            php -l "$f"
          done
