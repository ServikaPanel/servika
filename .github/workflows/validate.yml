name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    # The live-database tests skip themselves without SERVIKA_TEST_DSN and the
    # package still prints ok, so without a server here every test that proves
    # the SQL passes by not running.
    #
    # 10.11 is the MariaDB AlmaLinux 10 ships. The image is pinned by digest for
    # the same reason the actions are pinned to a commit: a tag can be moved.
    # The root account has no password because the container exists only on the
    # runner for the length of this job, and a credential in the repository
    # would read as a real one.
    services:
      mariadb:
        image: mariadb:10.11@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: panel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # The parameters are the production DSN's (servika-install.sh). parseTime is
    # load-bearing: without it a TIMESTAMP scans as []uint8 and the attack-chain
    # correlator drops every event it reads.
    env:
      SERVIKA_TEST_DSN: root@tcp(127.0.0.1:3306)/panel?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go vet ./...

      - name: go vet (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...

      # The vhost tests shell out to `nginx -t` and skip themselves when no nginx
      # is on PATH, so without this the configuration gates pass by not running.
      #
      # It comes from nginx.org rather than from Ubuntu: 24.04 packages 1.24,
      # which predates `http2 on;` and so rejects the configuration Servika ships
      # for AlmaLinux 10 (nginx 1.26) as an unknown directive. The tests refuse to
      # run against a version that old rather than report that as a defect.
      - name: nginx (for the configuration syntax tests)
        run: |
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list
          sudo apt-get update && sudo apt-get install -y nginx
          nginx -v

      # The live-database tests expect the panel's schema, and the thing that
      # builds it on a server is the migration runner the panel calls at startup.
      - name: Apply migrations to the test database
        run: go run scripts/migrate_test_db.go

      # -count=1 because a cached PASS is not a test run.
      #
      # -race because the concurrency tests (the SSL job map, the upload slot,
      # the PHP version cache, the diskusage single-flight) assert no value: a
      # lost mutex does not panic, so only the detector can turn them red.
      - name: go test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Namespace, key and placeholder parity of the eleven translations against
      # en. tsc, ESLint and the build all pass with a key missing from a locale,
      # so this is the only gate that sees it. The script uses node built-ins
      # only, so it needs no npm ci.
      - name: Translation parity
        run: node scripts/i18n-verify.mjs

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      # The config and the plugins were already installed, but nothing ran them,
      # so the rules-of-hooks and no-restricted-globals gates only existed on
      # paper.
      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  lint:
    name: Shell and PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A git tag is mutable: whoever controls an action's repository can move it
      # to any commit. The release job is the one place on this repository holding
      # `contents: write`, and it produces the artifact install.sh and
      # servika-update install as root on every server, so a repointed tag runs
      # code that can substitute the bundle bytes BEFORE sha256sum sees them.
      #
      # A local reusable workflow (./.github/...) is this repository's own file
      # and has nothing to pin.
      - name: Actions are pinned to a commit SHA
        run: |
          unpinned="$(grep -rhoE '^\s*(- )?uses: [^ ]+' .github/workflows/ \
            | sed -E 's/^\s*(- )?uses: //' \
            | grep -v '^\./' \
            | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$unpinned" ]; then
            echo "These actions are referenced by a mutable tag, not a commit SHA:"
            echo "$unpinned"
            echo
            echo "Resolve each with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>"
            exit 1
          fi

      - name: shellcheck
        run: shellcheck -S warning assets/ops/*

      - name: PHP syntax
        run: |
          for f in assets/phpmyadmin/*.php; do
            php -l "$f"
          done
